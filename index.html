<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素风机甲对战 - MECHA BATTLE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 900px;
            height: 600px;
            background: #0f0f1a;
            border: 4px solid #3d405b;
            box-shadow: 
                0 0 0 4px #1a1a2e,
                0 0 40px rgba(230, 57, 70, 0.3),
                0 0 40px rgba(69, 123, 157, 0.3);
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1) 0px,
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
        }

        .crt-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at center,
                transparent 0%,
                rgba(0, 0, 0, 0.2) 90%,
                rgba(0, 0, 0, 0.4) 100%
            );
            pointer-events: none;
        }

        .ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .health-container {
            width: 300px;
        }

        .health-label {
            color: #f1faee;
            font-size: 14px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0 #000;
        }

        .health-bar-bg {
            width: 100%;
            height: 25px;
            background: #2b2d42;
            border: 3px solid #3d405b;
            position: relative;
        }

        .health-bar {
            height: 100%;
            transition: width 0.3s;
        }

        .player1-health {
            background: linear-gradient(180deg, #e63946 0%, #9d0208 100%);
        }

        .player2-health {
            background: linear-gradient(180deg, #457b9d 0%, #1d3557 100%);
        }

        .health-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
        }

        .vs-text {
            color: #ffd700;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 
                2px 2px 0 #000,
                -1px -1px 0 #000;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .controls-panel {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .controls-info {
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border: 2px solid #3d405b;
            color: #f1faee;
            font-size: 10px;
        }

        .controls-info h4 {
            margin-bottom: 5px;
            color: #ffd700;
        }

        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 26, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .menu-overlay.hidden {
            display: none;
        }

        .game-title {
            font-size: 48px;
            color: #e63946;
            text-shadow: 
                4px 4px 0 #1d3557,
                -2px -2px 0 #457b9d;
            margin-bottom: 10px;
            animation: titleGlow 2s infinite;
        }

        .game-subtitle {
            font-size: 24px;
            color: #457b9d;
            margin-bottom: 40px;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 4px 4px 0 #1d3557, -2px -2px 0 #457b9d, 0 0 20px #e63946; }
            50% { text-shadow: 4px 4px 0 #1d3557, -2px -2px 0 #457b9d, 0 0 40px #e63946; }
        }

        .start-button {
            background: linear-gradient(180deg, #e63946 0%, #9d0208 100%);
            color: #fff;
            border: 4px solid #f1faee;
            padding: 15px 40px;
            font-size: 24px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            animation: blink 1s infinite;
            text-shadow: 2px 2px 0 #000;
        }

        .start-button:hover {
            background: linear-gradient(180deg, #ff6b6b 0%, #e63946 100%);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .mech-preview {
            display: flex;
            gap: 100px;
            margin: 30px 0;
        }

        .mech-card {
            text-align: center;
            padding: 20px;
            background: rgba(61, 64, 91, 0.5);
            border: 3px solid #3d405b;
        }

        .mech-card h3 {
            color: #ffd700;
            margin-bottom: 10px;
        }

        .mech-card p {
            color: #f1faee;
            font-size: 12px;
        }

        .controls-guide {
            margin-top: 30px;
            display: flex;
            gap: 80px;
        }

        .player-controls {
            text-align: center;
        }

        .player-controls h4 {
            color: #ffd700;
            margin-bottom: 10px;
        }

        .player-controls p {
            color: #f1faee;
            font-size: 11px;
            line-height: 1.6;
        }

        .winner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 26, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .winner-overlay.hidden {
            display: none;
        }

        .winner-text {
            font-size: 64px;
            color: #ffd700;
            text-shadow: 
                4px 4px 0 #000,
                0 0 30px #ffd700;
            animation: winnerPulse 0.5s infinite;
        }

        .winner-text.player1 {
            color: #e63946;
            text-shadow: 4px 4px 0 #000, 0 0 30px #e63946;
        }

        .winner-text.player2 {
            color: #457b9d;
            text-shadow: 4px 4px 0 #000, 0 0 30px #457b9d;
        }

        @keyframes winnerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .winner-sub {
            font-size: 24px;
            color: #f1faee;
            margin: 20px 0;
        }

        .restart-button {
            background: linear-gradient(180deg, #3d405b 0%, #1a1a2e 100%);
            color: #ffd700;
            border: 4px solid #ffd700;
            padding: 15px 40px;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            margin-top: 20px;
        }

        .restart-button:hover {
            background: linear-gradient(180deg, #4a4e69 0%, #2b2d42 100%);
        }

        .key {
            display: inline-block;
            background: #3d405b;
            color: #f1faee;
            padding: 2px 6px;
            border: 1px solid #f1faee;
            margin: 0 2px;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="900" height="600"></canvas>
        <div class="scanlines"></div>
        <div class="crt-effect"></div>

        <div class="ui-overlay">
            <div class="health-container">
                <div class="health-label">红狼机甲 [WASD + J/K]</div>
                <div class="health-bar-bg">
                    <div class="health-bar player1-health" id="player1Health"></div>
                    <div class="health-text" id="player1HealthText">100</div>
                </div>
            </div>
            <div class="vs-text">VS</div>
            <div class="health-container">
                <div class="health-label">[↑←↓→ + 1/2] 蓝鹰机甲</div>
                <div class="health-bar-bg">
                    <div class="health-bar player2-health" id="player2Health"></div>
                    <div class="health-text" id="player2HealthText">100</div>
                </div>
            </div>
        </div>

        <div class="controls-panel">
            <div class="controls-info">
                <strong>P1:</strong> <span class="key">W</span>跳 <span class="key">A</span><span class="key">D</span>移动 <span class="key">S</span>防御 <span class="key">J</span>轻攻 <span class="key">K</span>重攻
            </div>
            <div class="controls-info">
                <strong>P2:</strong> <span class="key">↑</span>跳 <span class="key">←</span><span class="key">→</span>移动 <span class="key">↓</span>防御 <span class="key">1</span>轻攻 <span class="key">2</span>重攻
            </div>
        </div>

        <div class="menu-overlay" id="menuOverlay">
            <h1 class="game-title">MECHA BATTLE</h1>
            <h2 class="game-subtitle">像素风机甲对战</h2>
            
            <div class="mech-preview">
                <div class="mech-card">
                    <h3>红狼机甲</h3>
                    <p>攻击型机甲<br>高攻击 · 中防御</p>
                </div>
                <div class="mech-card">
                    <h3>蓝鹰机甲</h3>
                    <p>防御型机甲<br>中攻击 · 高防御</p>
                </div>
            </div>

            <div class="controls-guide">
                <div class="player-controls">
                    <h4>玩家1 - 红狼</h4>
                    <p>
                        <span class="key">W</span> 跳跃<br>
                        <span class="key">A</span> <span class="key">D</span> 左右移动<br>
                        <span class="key">S</span> 防御<br>
                        <span class="key">J</span> 轻攻击<br>
                        <span class="key">K</span> 重攻击
                    </p>
                </div>
                <div class="player-controls">
                    <h4>玩家2 - 蓝鹰</h4>
                    <p>
                        <span class="key">↑</span> 跳跃<br>
                        <span class="key">←</span> <span class="key">→</span> 左右移动<br>
                        <span class="key">↓</span> 防御<br>
                        <span class="key">1</span> 轻攻击<br>
                        <span class="key">2</span> 重攻击
                    </p>
                </div>
            </div>

            <button class="start-button" id="startButton">PRESS START</button>
        </div>

        <div class="winner-overlay hidden" id="winnerOverlay">
            <div class="winner-text" id="winnerText">WINNER!</div>
            <div class="winner-sub" id="winnerSub">红狼机甲 胜利!</div>
            <button class="restart-button" id="restartButton">再来一局</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GAME_WIDTH = 900;
        const GAME_HEIGHT = 600;
        const GROUND_Y = 480;
        const GRAVITY = 0.8;
        const MOVE_SPEED = 5;
        const JUMP_FORCE = -16;

        const COLORS = {
            red: '#e63946',
            redDark: '#9d0208',
            blue: '#457b9d',
            blueDark: '#1d3557',
            gray: '#3d405b',
            lightGray: '#8d99ae',
            darkBg: '#2b2d42',
            white: '#f1faee',
            yellow: '#ffd700',
            metal: '#6c757d',
            metalDark: '#495057'
        };

        class Particle {
            constructor(x, y, color, vx, vy) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = vx || (Math.random() - 0.5) * 8;
                this.vy = vy || (Math.random() - 0.5) * 8 - 3;
                this.life = 30;
                this.maxLife = 30;
                this.size = Math.random() * 4 + 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2;
                this.life--;
            }

            draw() {
                const alpha = this.life / this.maxLife;
                ctx.fillStyle = this.color;
                ctx.globalAlpha = alpha;
                ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
                ctx.globalAlpha = 1;
            }

            isDead() {
                return this.life <= 0;
            }
        }

        class Player {
            constructor(id, x, isPlayer1) {
                this.id = id;
                this.x = x;
                this.y = GROUND_Y;
                this.width = 60;
                this.height = 80;
                this.velocityX = 0;
                this.velocityY = 0;
                this.health = 100;
                this.maxHealth = 100;
                this.isPlayer1 = isPlayer1;
                this.facing = isPlayer1 ? 1 : -1;
                this.state = 'idle';
                this.isGrounded = true;
                this.attackCooldown = 0;
                this.attackFrame = 0;
                this.isAttacking = false;
                this.hitCooldown = 0;
                this.animationFrame = 0;
                this.walkFrame = 0;
                this.particles = [];
                
                this.mainColor = isPlayer1 ? COLORS.red : COLORS.blue;
                this.darkColor = isPlayer1 ? COLORS.redDark : COLORS.blueDark;
                this.name = isPlayer1 ? '红狼' : '蓝鹰';
            }

            move(direction) {
                if (this.state === 'hit' || this.state === 'win') return;
                this.velocityX = direction * MOVE_SPEED;
                this.facing = direction;
                if (this.isGrounded && this.state !== 'attack') {
                    this.state = 'walk';
                }
            }

            jump() {
                if (this.isGrounded && this.state !== 'hit' && this.state !== 'win') {
                    this.velocityY = JUMP_FORCE;
                    this.isGrounded = false;
                    this.state = 'jump';
                    this.createJumpParticles();
                }
            }

            attack(type) {
                if (this.attackCooldown > 0 || this.state === 'hit' || this.state === 'win') return;
                
                this.state = 'attack';
                this.isAttacking = true;
                this.attackFrame = 0;
                this.attackType = type;
                
                if (type === 'light') {
                    this.attackCooldown = 18;
                    this.attackDamage = 10;
                    this.attackRange = 50;
                } else {
                    this.attackCooldown = 30;
                    this.attackDamage = 25;
                    this.attackRange = 70;
                }
                
                this.createAttackParticles();
            }

            defend(isDefending) {
                if (isDefending && this.state !== 'attack' && this.state !== 'hit' && this.state !== 'win') {
                    this.state = 'defend';
                    this.velocityX = 0;
                } else if (!isDefending && this.state === 'defend') {
                    this.state = 'idle';
                }
            }

            takeDamage(damage, fromDirection) {
                if (this.hitCooldown > 0) return false;
                
                let actualDamage = damage;
                if (this.state === 'defend') {
                    actualDamage = Math.floor(damage * 0.5);
                    this.createDefendParticles();
                }
                
                this.health = Math.max(0, this.health - actualDamage);
                this.state = 'hit';
                this.hitCooldown = 20;
                this.velocityX = fromDirection * 8;
                this.velocityY = -5;
                this.isGrounded = false;
                this.createHitParticles();
                
                return true;
            }

            update() {
                if (this.attackCooldown > 0) this.attackCooldown--;
                if (this.hitCooldown > 0) {
                    this.hitCooldown--;
                    if (this.hitCooldown === 0 && this.state === 'hit') {
                        this.state = 'idle';
                    }
                }

                if (this.state === 'attack') {
                    this.attackFrame++;
                    if (this.attackFrame > 15) {
                        this.state = 'idle';
                        this.isAttacking = false;
                    }
                }

                this.velocityY += GRAVITY;
                this.x += this.velocityX;
                this.y += this.velocityY;

                if (this.y >= GROUND_Y) {
                    this.y = GROUND_Y;
                    this.velocityY = 0;
                    this.isGrounded = true;
                    if (this.state === 'jump') {
                        this.state = 'idle';
                    }
                }

                if (this.x < 30) this.x = 30;
                if (this.x > GAME_WIDTH - this.width - 30) this.x = GAME_WIDTH - this.width - 30;

                this.velocityX *= 0.85;

                if (Math.abs(this.velocityX) < 0.1) {
                    this.velocityX = 0;
                    if (this.state === 'walk' && this.isGrounded) {
                        this.state = 'idle';
                    }
                }

                this.walkFrame++;
                this.animationFrame++;

                this.particles = this.particles.filter(p => {
                    p.update();
                    return !p.isDead();
                });
            }

            getAttackHitbox() {
                if (!this.isAttacking || this.attackFrame < 5 || this.attackFrame > 12) return null;
                
                return {
                    x: this.facing === 1 ? this.x + this.width : this.x - this.attackRange,
                    y: this.y - this.height / 2,
                    width: this.attackRange,
                    height: 40
                };
            }

            getHitbox() {
                return {
                    x: this.x + 10,
                    y: this.y - this.height,
                    width: this.width - 20,
                    height: this.height
                };
            }

            createAttackParticles() {
                const px = this.facing === 1 ? this.x + this.width : this.x;
                const py = this.y - this.height / 2;
                for (let i = 0; i < 8; i++) {
                    this.particles.push(new Particle(
                        px, py, 
                        this.mainColor,
                        this.facing * (Math.random() * 5 + 2),
                        (Math.random() - 0.5) * 4
                    ));
                }
            }

            createHitParticles() {
                const px = this.x + this.width / 2;
                const py = this.y - this.height / 2;
                for (let i = 0; i < 12; i++) {
                    this.particles.push(new Particle(
                        px, py, 
                        COLORS.yellow,
                        (Math.random() - 0.5) * 10,
                        (Math.random() - 0.5) * 10
                    ));
                }
            }

            createDefendParticles() {
                const px = this.x + this.width / 2;
                const py = this.y - this.height / 2;
                for (let i = 0; i < 6; i++) {
                    this.particles.push(new Particle(
                        px, py, 
                        COLORS.white,
                        (Math.random() - 0.5) * 6,
                        (Math.random() - 0.5) * 6
                    ));
                }
            }

            createJumpParticles() {
                for (let i = 0; i < 5; i++) {
                    this.particles.push(new Particle(
                        this.x + this.width / 2, this.y,
                        COLORS.metal,
                        (Math.random() - 0.5) * 4,
                        Math.random() * -2
                    ));
                }
            }

            draw() {
                ctx.save();
                
                const drawX = Math.floor(this.x);
                const drawY = Math.floor(this.y);
                
                if (this.state === 'defend') {
                    ctx.globalAlpha = 0.7;
                }

                ctx.translate(drawX + this.width / 2, drawY);
                ctx.scale(this.facing, 1);
                ctx.translate(-this.width / 2, 0);

                this.drawMech(0, -this.height);

                ctx.restore();

                this.particles.forEach(p => p.draw());
            }

            drawMech(x, y) {
                const bobOffset = this.state === 'idle' ? Math.sin(this.animationFrame * 0.1) * 2 : 0;
                const walkOffset = this.state === 'walk' ? Math.sin(this.walkFrame * 0.3) * 3 : 0;

                ctx.fillStyle = this.darkColor;
                ctx.fillRect(x + 15, y + 5 + bobOffset, 30, 10);
                
                ctx.fillStyle = this.mainColor;
                ctx.fillRect(x + 10, y + 15 + bobOffset, 40, 25);
                
                ctx.fillStyle = COLORS.metalDark;
                ctx.fillRect(x + 15, y + 20 + bobOffset, 10, 8);
                ctx.fillRect(x + 35, y + 20 + bobOffset, 10, 8);
                
                if (this.state === 'attack') {
                    const attackProgress = this.attackFrame / 15;
                    const punchExtend = Math.sin(attackProgress * Math.PI) * 25;
                    
                    ctx.fillStyle = this.mainColor;
                    ctx.fillRect(x + 45 + punchExtend, y + 22 + bobOffset, 20, 12);
                    ctx.fillStyle = COLORS.metal;
                    ctx.fillRect(x + 55 + punchExtend, y + 20 + bobOffset, 15, 16);
                } else {
                    ctx.fillStyle = this.mainColor;
                    ctx.fillRect(x + 45, y + 22 + bobOffset, 15, 12);
                    ctx.fillStyle = COLORS.metal;
                    ctx.fillRect(x + 55, y + 20 + bobOffset, 10, 16);
                }

                ctx.fillStyle = this.mainColor;
                if (this.state === 'defend') {
                    ctx.fillRect(x + 40, y + 18 + bobOffset, 20, 12);
                } else {
                    ctx.fillRect(x + 35, y + 15 + bobOffset, 12, 10);
                }

                ctx.fillStyle = this.darkColor;
                ctx.fillRect(x + 20, y + 40 + bobOffset, 20, 20);
                
                ctx.fillStyle = this.mainColor;
                ctx.fillRect(x + 15, y + 45 + bobOffset, 10, 25 + walkOffset);
                ctx.fillRect(x + 35, y + 45 + bobOffset, 10, 25 - walkOffset);
                
                ctx.fillStyle = COLORS.metal;
                ctx.fillRect(x + 12, y + 65 + bobOffset + walkOffset, 15, 8);
                ctx.fillRect(x + 33, y + 65 + bobOffset - walkOffset, 15, 8);
                
                ctx.fillStyle = COLORS.metalDark;
                ctx.fillRect(x + 17, y + 70 + bobOffset + walkOffset, 8, 5);
                ctx.fillRect(x + 35, y + 70 + bobOffset - walkOffset, 8, 5);

                ctx.fillStyle = this.darkColor;
                ctx.fillRect(x + 30, y - 5 + bobOffset, 20, 20);
                
                ctx.fillStyle = this.mainColor;
                ctx.fillRect(x + 20, y + bobOffset, 40, 15);
                
                ctx.fillStyle = COLORS.metal;
                ctx.fillRect(x + 25, y - 8 + bobOffset, 8, 8);
                ctx.fillRect(x + 47, y - 8 + bobOffset, 8, 8);

                ctx.fillStyle = '#00ff00';
                ctx.globalAlpha = 0.8;
                ctx.fillRect(x + 28, y + 2 + bobOffset, 6, 4);
                ctx.fillRect(x + 36, y + 2 + bobOffset, 6, 4);
                ctx.globalAlpha = 1;

                if (this.state === 'win') {
                    const winBob = Math.sin(this.animationFrame * 0.2) * 5;
                    ctx.fillStyle = this.mainColor;
                    ctx.fillRect(x + 45, y - 15 + winBob, 15, 8);
                    ctx.fillStyle = COLORS.yellow;
                    ctx.fillRect(x + 48, y - 18 + winBob, 9, 5);
                }

                if (this.state === 'hit') {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.fillRect(x, y - this.height, this.width, this.height);
                }
            }
        }

        class Game {
            constructor() {
                this.state = 'menu';
                this.player1 = null;
                this.player2 = null;
                this.particles = [];
                this.keys = {};
                this.setupEventListeners();
            }

            setupEventListeners() {
                document.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    if (this.state === 'menu' && (e.code === 'Space' || e.code === 'Enter')) {
                        this.startGame();
                    }
                });

                document.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });

                document.getElementById('startButton').addEventListener('click', () => {
                    this.startGame();
                });

                document.getElementById('restartButton').addEventListener('click', () => {
                    this.restartGame();
                });
            }

            startGame() {
                this.state = 'playing';
                this.player1 = new Player(1, 150, true);
                this.player2 = new Player(2, GAME_WIDTH - 210, false);
                document.getElementById('menuOverlay').classList.add('hidden');
                document.getElementById('winnerOverlay').classList.add('hidden');
                this.updateHealthUI();
            }

            restartGame() {
                this.startGame();
            }

            handleInput() {
                if (this.state !== 'playing') return;

                if (this.keys['KeyW']) this.player1.jump();
                if (this.keys['KeyA']) this.player1.move(-1);
                if (this.keys['KeyD']) this.player1.move(1);
                if (this.keys['KeyS']) this.player1.defend(true);
                else this.player1.defend(false);
                if (this.keys['KeyJ']) this.player1.attack('light');
                if (this.keys['KeyK']) this.player1.attack('heavy');

                if (this.keys['ArrowUp']) this.player2.jump();
                if (this.keys['ArrowLeft']) this.player2.move(-1);
                if (this.keys['ArrowRight']) this.player2.move(1);
                if (this.keys['ArrowDown']) this.player2.defend(true);
                else this.player2.defend(false);
                if (this.keys['Digit1']) this.player2.attack('light');
                if (this.keys['Digit2']) this.player2.attack('heavy');
            }

            checkCollisions() {
                if (this.state !== 'playing') return;

                const p1Attack = this.player1.getAttackHitbox();
                const p2Hit = this.player2.getHitbox();
                
                if (p1Attack) {
                    if (this.checkAABB(p1Attack, p2Hit)) {
                        const damage = this.player1.takeDamage(this.player1.attackDamage, this.player1.facing);
                        if (damage) {
                            this.player1.isAttacking = false;
                            this.createHitParticles(this.player2.x + 30, this.player2.y - 40, COLORS.yellow);
                        }
                    }
                }

                const p2Attack = this.player2.getAttackHitbox();
                const p1Hit = this.player1.getHitbox();
                
                if (p2Attack) {
                    if (this.checkAABB(p2Attack, p1Hit)) {
                        const damage = this.player2.takeDamage(this.player2.attackDamage, this.player2.facing);
                        if (damage) {
                            this.player2.isAttacking = false;
                            this.createHitParticles(this.player1.x + 30, this.player1.y - 40, COLORS.yellow);
                        }
                    }
                }
            }

            checkAABB(a, b) {
                return a.x < b.x + b.width &&
                       a.x + a.width > b.x &&
                       a.y < b.y + b.height &&
                       a.y + a.height > b.y;
            }

            createHitParticles(x, y, color) {
                for (let i = 0; i < 8; i++) {
                    this.particles.push(new Particle(x, y, color));
                }
            }

            checkWinCondition() {
                if (this.state !== 'playing') return;

                if (this.player1.health <= 0) {
                    this.state = 'end';
                    this.player1.state = 'win';
                    this.player2.state = 'win';
                    this.showWinner(2);
                } else if (this.player2.health <= 0) {
                    this.state = 'end';
                    this.player1.state = 'win';
                    this.player2.state = 'win';
                    this.showWinner(1);
                }
            }

            showWinner(playerNum) {
                const overlay = document.getElementById('winnerOverlay');
                const text = document.getElementById('winnerText');
                const sub = document.getElementById('winnerSub');
                
                text.className = 'winner-text ' + (playerNum === 1 ? 'player1' : 'player2');
                text.textContent = 'WINNER!';
                sub.textContent = (playerNum === 1 ? '红狼机甲' : '蓝鹰机甲') + ' 胜利!';
                
                overlay.classList.remove('hidden');
            }

            updateHealthUI() {
                const p1HealthBar = document.getElementById('player1Health');
                const p1HealthText = document.getElementById('player1HealthText');
                const p2HealthBar = document.getElementById('player2Health');
                const p2HealthText = document.getElementById('player2HealthText');

                if (this.player1 && this.player2) {
                    p1HealthBar.style.width = this.player1.health + '%';
                    p1HealthText.textContent = this.player1.health;
                    p2HealthBar.style.width = this.player2.health + '%';
                    p2HealthText.textContent = this.player2.health;
                }
            }

            update() {
                this.handleInput();

                if (this.state === 'playing') {
                    this.player1.update();
                    this.player2.update();
                    this.checkCollisions();
                    this.checkWinCondition();
                    this.updateHealthUI();
                }

                this.particles = this.particles.filter(p => {
                    p.update();
                    return !p.isDead();
                });
            }

            drawBackground() {
                ctx.fillStyle = COLORS.darkBg;
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

                ctx.fillStyle = '#1a1a2e';
                for (let i = 0; i < 5; i++) {
                    const bx = 100 + i * 180;
                    const bh = 150 + Math.sin(i * 1.5) * 50;
                    ctx.fillRect(bx, GROUND_Y - bh - 100, 80, bh);
                    ctx.fillRect(bx - 10, GROUND_Y - bh - 100, 100, 20);
                }

                ctx.fillStyle = COLORS.gray;
                for (let i = 0; i < 3; i++) {
                    const px = 250 + i * 200;
                    ctx.fillRect(px, 100, 15, GROUND_Y - 150);
                    ctx.fillRect(px - 5, 95, 25, 15);
                }

                ctx.fillStyle = COLORS.lightGray;
                ctx.fillRect(0, GROUND_Y - 20, GAME_WIDTH, 5);
                
                for (let i = 0; i < GAME_WIDTH; i += 40) {
                    ctx.fillStyle = i % 80 === 0 ? COLORS.metalDark : COLORS.gray;
                    ctx.fillRect(i, GROUND_Y - 15, 40, 15);
                }

                ctx.fillStyle = COLORS.metal;
                ctx.fillRect(0, GROUND_Y, GAME_WIDTH, 120);
                
                for (let i = 0; i < GAME_WIDTH; i += 60) {
                    ctx.fillStyle = i % 120 === 0 ? COLORS.metalDark : COLORS.gray;
                    ctx.fillRect(i, GROUND_Y, 60, 5);
                }

                ctx.fillStyle = 'rgba(255, 215, 0, 0.1)';
                ctx.fillRect(0, 0, GAME_WIDTH, 80);

                ctx.fillStyle = COLORS.yellow;
                ctx.globalAlpha = 0.3;
                for (let i = 0; i < 8; i++) {
                    const sx = 100 + i * 110;
                    ctx.fillRect(sx, 30, 3, 50);
                    ctx.fillRect(sx - 5, 25, 13, 8);
                }
                ctx.globalAlpha = 1;
            }

            render() {
                ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                
                this.drawBackground();

                if (this.state === 'playing' || this.state === 'end') {
                    this.player1.draw();
                    this.player2.draw();
                }

                this.particles.forEach(p => p.draw());
            }

            gameLoop() {
                this.update();
                this.render();
                requestAnimationFrame(() => this.gameLoop());
            }

            init() {
                this.gameLoop();
            }
        }

        const game = new Game();
        game.init();
    </script>
</body>
</html>
